        const baseUrl = "https://castle-studio-work.github.io/align-nexus-public-bridge/";
        const container = document.getElementById('list');

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <input type="checkbox" class="chk" value="${baseUrl}${item.html}">
                <div class="file-info" style="cursor:pointer;" onclick="const cb = this.previousElementSibling; cb.checked = !cb.checked;">
                    <strong>${item.name}</strong>
                    <span class="preview">${item.preview}...</span>
                </div>
            `;
            container.appendChild(div);
        });

        function selectAll(b) {
            document.querySelectorAll('.chk').forEach(c => c.checked = b);
        }

        function generate() {
            const selected = Array.from(document.querySelectorAll('.chk:checked')).map(c => c.value);
            const output = document.getElementById('output');
            output.value = selected.join('\n');
            output.select();
            document.execCommand('copy');
            alert('已生成 ' + selected.length + ' 個 HTML 連結並複製到剪貼簿！');
        }
