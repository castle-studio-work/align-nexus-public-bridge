<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Align Nexus 數據匯入控制台</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.5; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .file-item { padding: 8px 0; border-bottom: 1px solid #eee; }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        textarea { width: 100%; height: 150px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🚀 Align Nexus 數據匯入控制台</h1>
    
    <div class="card">
        <h3>1. 勾選檔案</h3>
        <div>
            <button onclick="selectAll(true)" style="background:#666">全部勾選</button>
            <button onclick="selectAll(false)" style="background:#999">取消全選</button>
        </div>
        <div id="list" style="margin-top:20px;"></div>
    </div>

    <div class="card">
        <h3>2. 生成清單</h3>
        <button onclick="generate()">生成匯入連結</button>
        <textarea id="output" readonly></textarea>
    </div>

    <script>
        const files = ["2026-01-27-iii-dai-review.md","2026-01-27-iii-dtri.md","2026-01-27-invent-ai.md","2026-01-28-kuen-yu-review.md","ISSUE_TEMPLATE.md","PAUL_CHEN_BIO.md","README.md","SKILL.md","_data.md","batch_2_research.md","batch_3_research.md","cloudflare-deploy.md","consolidated_resumes.md","cover_letter.md","general-issue-template.md","interview_prep.md","intro.md","job_description.md","n8n_vs_agent_architecture.md","prep.md","pull_request_template.md","research.md","resume.md","self_intro_article.md","self_intro_speech.md","social_media_recruitment.md"];
        const baseUrl = "https://castle-studio-work.github.io/align-nexus-public-bridge/";
        const container = document.getElementById('list');

        // 強制渲染列表
        files.forEach(f => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = '<label><input type="checkbox" class="chk" value="' + baseUrl + f + '"> <b>' + f + '</b></label>';
            container.appendChild(item);
        });

        function selectAll(b) {
            document.querySelectorAll('.chk').forEach(c => c.checked = b);
        }

        function generate() {
            const selected = Array.from(document.querySelectorAll('.chk:checked')).map(c => c.value);
            document.getElementById('output').value = selected.join('\n');
            alert('已生成 ' + selected.length + ' 個連結，請從下方方塊複製。');
        }
    </script>
</body>
</html>
